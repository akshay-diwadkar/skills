name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  context-load:
    name: Context-load budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install measurement and skill runtimes
        run: |
          python -m pip install -r tools/validation/structured-evidence-requirements.txt
          python -m pip install "tiktoken>=0.7,<1"
          python -m pip install -r skills/technical-communication/manualize/requirements.txt
      - name: Check budgets and publish pull-request deltas
        if: github.event_name == 'pull_request'
        run: >-
          python tools/validation/measure_context_load.py --check
          --exclude-skill map-codebase
          --compare-ref "${{ github.event.pull_request.base.sha }}"
          --summary-file "$GITHUB_STEP_SUMMARY"
      - name: Check budgets and publish totals
        if: github.event_name != 'pull_request'
        run: >-
          python tools/validation/measure_context_load.py --check
          --exclude-skill map-codebase
          --summary-file "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: context-load-report
          path: benchmarks/reports/context-load.json
          if-no-files-found: error

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install ruff mypy pytest playwright
          python -m pip install -r tools/validation/structured-evidence-requirements.txt
          python -m pip install "tiktoken>=0.7,<1"
          python -m pip install -r skills/technical-communication/manualize/requirements.txt
      - name: Lint
        run: ruff check .
      - name: Type check
        run: python tools/validation/run_mypy.py --exclude-skill map-codebase
      - name: Repository validation
        run: python tools/validation/validate_repository.py
      - name: Test
        run: >-
          python -m pytest
          --ignore=tests/skills/map-codebase
          -m "not fixtures and not benchmark and not benchmark_slow" -q
          --deselect "tests/classification/test_classification.py::test_deterministic_classification_fixture[map-codebase-positive]"
          --deselect "tests/classification/test_classification.py::test_deterministic_classification_fixture[map-codebase-negative]"
          --deselect "tests/classification/test_classification.py::test_deterministic_classification_fixture[map-codebase-ambiguous]"
          --deselect "tests/classification/test_classification.py::test_deterministic_classification_fixture[map-codebase-adversarial]"
          --deselect "tests/integration/test_installed_skill_execution.py::test_remaining_skill_common_cli_runs_from_standalone_install[engineering-map-codebase]"

  cross-platform:
    name: Cross-Platform Runtime (${{ matrix.os }}, Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install pytest
          python -m pip install -r tools/validation/structured-evidence-requirements.txt
          python -m pip install "tiktoken>=0.7,<1"
          python -m pip install -r skills/technical-communication/manualize/requirements.txt
      - name: Run installed skill execution tests
        run: >-
          python -m pytest tests/integration/test_installed_skill_execution.py -v
          --deselect "tests/integration/test_installed_skill_execution.py::test_remaining_skill_common_cli_runs_from_standalone_install[engineering-map-codebase]"
      - name: Verify deterministic context-load report
        run: python tools/validation/measure_context_load.py --check --exclude-skill map-codebase

  npx-install:
    name: Skills CLI Installation (${{ matrix.agent }})
    strategy:
      fail-fast: false
      matrix:
        agent: [claude-code, codex, github-copilot]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Verify grouped discovery
        if: matrix.agent == 'codex'
        env:
          FORCE_COLOR: "0"
          NO_COLOR: "1"
        run: |
          npx --yes skills@1.5.21 add "$GITHUB_WORKSPACE" --list | tee "$RUNNER_TEMP/skills-list.txt"
          python tools/validation/validate_npx_output.py "$RUNNER_TEMP/skills-list.txt"
      - name: Verify complete and individual installations
        run: python tools/validation/validate_skills_cli_install.py --agent "${{ matrix.agent }}"
