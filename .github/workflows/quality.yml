name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install ruff mypy pytest playwright
          python -m pip install -r skills/engineering/plan-change/requirements.txt
          python -m pip install -r skills/engineering/map-codebase/requirements.txt
          python -m pip install -r skills/technical-communication/manualize/requirements.txt
      - name: Lint
        run: ruff check .
      - name: Type check
        run: python tools/validation/run_mypy.py
      - name: Repository validation
        run: python tools/validation/validate_repository.py
      - name: Test
        run: python -m pytest -m "not fixtures and not benchmark and not benchmark_slow" -q

  fixture-contract:
    name: Fixture Contract (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install fixture dependencies
        run: |
          python -m pip install pytest
          python -m pip install -r skills/engineering/map-codebase/requirements.txt
      - name: Validate fixture lifecycle
        run: |
          python -m tools.benchmarks validate
          python -m tools.benchmarks regenerate --check
          python -m tools.benchmarks audit --check
      - name: Run fixture contract tests
        run: python -m pytest -m fixtures -q

  representative-benchmark:
    name: Representative Deterministic Benchmarks
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install benchmark dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
          python -m pip install pytest
          python -m pip install -r skills/engineering/map-codebase/requirements.txt
          python -m pip install -r skills/technical-communication/manualize/requirements.txt
      - name: Run representative deterministic benchmarks
        run: python -m pytest -m "benchmark and not benchmark_slow" -q

  cross-platform:
    name: Cross-Platform Runtime (${{ matrix.os }}, Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install pytest
          python -m pip install -r skills/engineering/plan-change/requirements.txt
          python -m pip install -r skills/technical-communication/manualize/requirements.txt
      - name: Run installed skill execution tests
        run: python -m pytest tests/integration/test_installed_skill_execution.py -v

  map-codebase-clean-install:
    name: Map Codebase Clean Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install test harness and runtime requirements
        run: |
          python -m pip install pytest
          python -m pip install -r skills/engineering/map-codebase/requirements.txt
      - name: Check runtime prerequisites
        run: python skills/engineering/map-codebase/scripts/cli.py doctor --repo-root .
      - name: Run map-codebase suite
        run: >-
          python -m pytest tests/skills/map-codebase
          -m "not fixtures and not benchmark and not benchmark_slow" -q

  npx-install:
    name: npx Grouped Installation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Verify grouped discovery
        env:
          FORCE_COLOR: "0"
          NO_COLOR: "1"
        run: |
          npx --yes skills@1.5.20 add "$GITHUB_WORKSPACE" --list | tee "$RUNNER_TEMP/skills-list.txt"
          python tools/validation/validate_npx_output.py "$RUNNER_TEMP/skills-list.txt"
      - name: Install the complete collection
        env:
          FORCE_COLOR: "0"
          NO_COLOR: "1"
        run: |
          mkdir -p "$RUNNER_TEMP/skills-consumer"
          cd "$RUNNER_TEMP/skills-consumer"
          npx --yes skills@1.5.20 add "$GITHUB_WORKSPACE" --skill '*' --agent codex --copy --yes
          test "$(find . -type f -name SKILL.md | wc -l)" -eq 10
