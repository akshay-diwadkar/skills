name: Deterministic Benchmarks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  map-codebase-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install benchmark dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
          python -m pip install pytest
          python -m pip install -r skills/engineering/map-codebase/requirements.txt
      - name: Validate fixture lifecycle
        run: |
          python -m tools.benchmarks validate
          python -m tools.benchmarks regenerate --check
          python -m tools.benchmarks audit --check
      - name: Run complete deterministic benchmark suite
        run: python -m pytest -m benchmark_slow -q
