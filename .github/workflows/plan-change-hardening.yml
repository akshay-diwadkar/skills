name: Plan Change Hardening

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install verification dependencies
        run: |
          python -m pip install mypy pytest pytest-subtests pyyaml ruff
          python -m pip install -r tools/validation/structured-evidence-requirements.txt
          python -m pip install -r skills/engineering/map-codebase/requirements.txt
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: python tools/validation/run_mypy.py
      - name: Repository contract
        run: python tools/validation/validate_repository.py
      - name: Plan Change
        run: python -m pytest tests/skills/plan-change -q
      - name: 50,003-file operation and timing gate
        env:
          PLAN_CHANGE_LARGE_REPO: "1"
        run: python -m pytest tests/skills/plan-change/test_no_exploration.py::test_repository_size_does_not_change_operations -q --durations=1
      - name: Implement Plan
        run: python -m pytest tests/skills/implement-plan -q
      - name: Scope Issue
        run: python -m pytest tests/skills/scope-issue -q
      - name: Installed skill execution
        run: >-
          python -m pytest tests/integration/test_installed_skill_execution.py -q
          --deselect "tests/integration/test_installed_skill_execution.py::test_remaining_skill_common_cli_runs_from_standalone_install[engineering-map-codebase]"
