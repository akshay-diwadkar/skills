name: Realistic Fixture Builds

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-realistic-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.11.11'}
      - uses: actions/setup-node@v6
        with: {node-version: '22.14.0'}
      - uses: actions/setup-java@v5
        with: {distribution: 'temurin', java-version: '17.0.14'}
      - uses: actions/setup-go@v6
        with: {go-version: '1.23.6'}
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.85.0'}
      - uses: actions/setup-dotnet@v5
        with: {dotnet-version: '8.0.407'}
      - name: Check committed fixture structure
        run: |
          python -m pip install pytest
          python -m pytest tests/benchmarks/test_realistic_fixture_quality.py -q
      - name: Build native project surfaces
        run: |
          python -m pip install --require-hashes -r benchmarks/repos/schema-migration-service/requirements.lock
          python -m compileall -q benchmarks/repos/schema-migration-service/services
          python -m pytest benchmarks/repos/schema-migration-service/tests -q
          npm --prefix benchmarks/repos/schema-migration-service ci --ignore-scripts
          npm --prefix benchmarks/repos/schema-migration-service run build
          npm --prefix benchmarks/repos/schema-migration-service test
          npm --prefix benchmarks/repos/plugin-workspace ci --ignore-scripts
          npm --prefix benchmarks/repos/plugin-workspace run build
          npm --prefix benchmarks/repos/plugin-workspace test
          (cd benchmarks/repos/plugin-workspace && sh ./gradlew --no-daemon test)
          (cd benchmarks/repos/component-pipeline && go test ./...)
          (cd benchmarks/repos/component-pipeline && cargo test --locked)
          dotnet restore benchmarks/repos/component-pipeline/dotnet/exporter/SignalForge.Exporter.csproj --locked-mode
          dotnet test benchmarks/repos/component-pipeline/dotnet/exporter/SignalForge.Exporter.csproj --no-restore
          dotnet restore benchmarks/repos/component-pipeline/dotnet/verification/SignalForge.Verification.csproj --locked-mode
          dotnet run --project benchmarks/repos/component-pipeline/dotnet/verification/SignalForge.Verification.csproj --no-restore
