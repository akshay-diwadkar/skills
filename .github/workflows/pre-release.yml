name: Pre-release Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-release:
    name: Validate release environment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install release validation dependencies
        run: python -m pip install -r tools/validation/release-requirements.txt

      - name: Validate release environment
        run: python tools/validation/validate_repository.py
