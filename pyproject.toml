[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"skills/engineering/*/scripts/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
explicit_package_bases = true
mypy_path = ["tools/validation"]
warn_unused_ignores = true
strict_optional = true
no_implicit_optional = true
exclude = [
  "tests/skills/plan-change/fixtures/",
  "tests/skills/plan-change/evals/fixtures/",
  "tests/skills/implement-plan/evals/fixtures/",
  "tests/skills/design-codebase/evals/fixtures/",
  "tests/skills/optimize-codebase/worked-example-fixtures/",
  "tests/skills/optimize-codebase/static-regression-cases/",
  "tests/skills/audit-codebase/evals/fixtures/",
  "tests/skills/map-codebase/eval/repos/",
]

[[tool.mypy.overrides]]
module = ["playwright.*", "yaml", "yaml.*", "jsonschema", "jsonschema.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = [
  "tests",
]
